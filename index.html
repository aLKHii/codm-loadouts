<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>aLKHii CODM Loadouts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<header>

<div class="logo">

<h1>aLKHii</h1>

<p>CODM Loadouts</p>

</div>

<div class="search">

<input
type="text"
placeholder="Search Weapon...">

</div>

</header>

<section class="cards" id="weaponContainer">

    <!--
        =====================================================
        WEAPON TEMPLATE
        =====================================================

        Kopyahin ang buong block sa ibaba kapag magdadagdag
        ka ng bagong weapon.

        Baguhin lamang ang:
        - Weapon Name
        - Category
        - Image
        - Note

    -->

    <div class="card">

        <!-- CHANGE IMAGE HERE -->
        <img src="images/weapon-image.png" alt="Weapon Name">

        <div class="info">

            <!-- CHANGE CATEGORY -->
            <span class="category">CATEGORY</span>

            <!-- CHANGE WEAPON NAME -->
            <h2>Weapon Name</h2>

            <!-- OPTIONAL -->
            <p>Meta Build</p>

        </div>

    </div>

</section>

<section class="hero">

<h2>

YOUR BEST

CODM

LOADOUTS

</h2>

<p>

Weapon builds.

Attachments.

Meta loadouts.

</p>

</section>

<section class="cards">

<div class="card">

<div class="placeholder">

Screenshot

</div>

<div class="info">

<span>

ASSAULT RIFLE

</span>

<h2>

BP50

</h2>

<p>

Best MP Ranked

</p>

</div>

</div>

<div class="card">

<div class="placeholder">

Screenshot

</div>

<div class="info">

<span>

SMG

</span>

<h2>

USS 9

</h2>

<p>

No Recoil Build

</p>

</div>

</div>

<div class="card">

<div class="placeholder">

Screenshot

</div>

<div class="info">

<span>

SHOTGUN

</span>

<h2>

Striker

</h2>

<p>

Close Range Build

</p>

</div>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
