<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aLKHii | CODM Loadouts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

<div class="logo">
<h1>aLKHii</h1>
<p>CODM Loadouts</p>
</div>

</header>

<section class="search-area">

<input
type="text"
id="searchInput"
placeholder="🔍 Search weapon...">

</section>

<section class="filters">

<button class="active">All</button>
<button>AR</button>
<button>SMG</button>
<button>LMG</button>
<button>Shotgun</button>
<button>Sniper</button>
<button>Marksman</button>
<button>Pistol</button>

</section>

<section id="weaponList" class="weapon-list">

<div class="weapon-card">

<img src="images/bp50.webp" alt="BP50">

<div class="info">

<span class="category">ASSAULT RIFLE</span>

<h2>BP50</h2>

<p>Best MP Ranked Build</p>

</div>

</div>

<div class="weapon-card">

<img src="images/uss9.webp" alt="USS9">

<div class="info">

<span class="category">SMG</span>

<h2>USS 9</h2>

<p>No Recoil Build</p>

</div>

</div>

<div class="weapon-card">

<img src="images/striker.webp" alt="Striker">

<div class="info">

<span class="category">SHOTGUN</span>

<h2>Striker</h2>

<p>Close Range Build</p>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
